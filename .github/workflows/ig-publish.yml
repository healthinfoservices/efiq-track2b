name: Build and Deploy IG

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Run unit tests
        run: python -m unittest discover -s tests -v

  build-ig:
    name: Build IG
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # 2. Set up Node.js (latest version)
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install SUSHI and Jekyll
        run: |
          LATEST_TAG=$(curl -sL -o /dev/null -w '%{url_effective}' https://github.com/HL7/fhir-ig-publisher/releases/latest | sed 's#.*/tag/##')
          echo "tag=$LATEST_TAG" >> "$GITHUB_OUTPUT"

      # 6. Cache IG Publisher
      - name: Cache IG Publisher
        id: cache-publisher
        uses: actions/cache@v4
        with:
          path: ./publisher.jar
          key: publisher-${{ steps.ig-publisher-version.outputs.tag }}        

      # 7. Download publisher.jar if not cached
      - name: Download IG Publisher
        if: steps.cache-publisher.outputs.cache-hit != 'true'
        run: |
          curl -L https://github.com/HL7/fhir-ig-publisher/releases/latest/download/publisher.jar -o publisher.jar

      # 8. Run Sushi
      - name: Run Sushi
        run: |
          set -euxo pipefail
          sushi . -l debug

      # 9. Install Ruby and Jekyll for IG rendering
      - name: Install Ruby and Jekyll
        run: |
          sudo apt-get update
          sudo apt-get install -y ruby-full build-essential zlib1g-dev
          sudo gem install jekyll bundler

      # 10. Check Sushi output
      - name: Check Sushi output
        run: |
          ls -R fsh-generated || (echo "Sushi did not generate output!" && exit 1)
          
      # 11. Run IG Publisher
      - name: Run IG Publisher
        run: |
          set -euxo pipefail
          java -Xmx4g -jar publisher.jar -ig ig.ini -tx https://tx.fhir.org | tee publisher.log
      # run: java -jar publisher.jar -ig ig.ini

      # 12. Upload IG Publisher log
      - name: Upload IG Publisher log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: publisher-log
          path: publisher.log

      # 13. Deploy to gh-pages branch setting the CNAME to core.fhir.health.gov.fj
      - name: Deploy IG to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          path: output

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build-ig
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
